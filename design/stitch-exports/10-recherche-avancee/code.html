<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Recherche Avancée</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f4256a",
              "background-light": "#f8f5f6",
              "background-dark": "#221016",
              "surface-light": "#ffffff",
              "surface-dark": "#2d161d",
              "text-primary-light": "#14080c",
              "text-primary-dark": "#f8f5f6",
              "text-secondary-light": "#6b555d",
              "text-secondary-dark": "#ba9ca6",
              "border-light": "#e4dce0",
              "border-dark": "#543b43",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-text-primary-light dark:text-text-primary-dark">close</span>
</div>
<h2 class="text-text-primary-light dark:text-text-primary-dark text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Recherche Avancée</h2>
<div class="flex w-12 items-center justify-end">
<button class="text-primary text-base font-bold leading-normal tracking-[0.015em] shrink-0">Reset</button>
</div>
</div>
<main class="flex-grow pb-40">
<!-- Section 1: Critères de base -->
<h3 class="text-text-primary-light dark:text-text-primary-dark text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Critères de base</h3>
<!-- Age Range Slider -->
<div class="@container px-4 py-2">
<div class="relative flex w-full flex-col items-start justify-between gap-3 @[480px]:flex-row">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal w-full shrink-[3]">Tranche d'âge</p>
<div class="flex h-[38px] w-full items-center pt-1.5">
<div class="flex h-1 w-full rounded-full bg-border-light dark:bg-border-dark pl-[20%] pr-[40%]">
<div class="relative">
<div class="absolute -left-3 -top-1.5 flex flex-col items-center gap-2">
<div class="size-4 rounded-full bg-primary ring-4 ring-primary/20"></div>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal">25</p>
</div>
</div>
<div class="h-1 flex-1 rounded-full bg-primary"></div>
<div class="relative">
<div class="absolute -left-3 -top-1.5 flex flex-col items-center gap-2">
<div class="size-4 rounded-full bg-primary ring-4 ring-primary/20"></div>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal">40</p>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Location TextField -->
<div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal pb-2">Localisation</p>
<div class="relative flex w-full flex-1 items-stretch rounded-xl">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl bg-surface-light dark:bg-surface-dark text-text-primary-light dark:text-text-primary-dark placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark focus:border-primary h-14 p-[15px] pr-12 text-base font-normal leading-normal" placeholder="Ville, code postal..."/>
<div class="absolute inset-y-0 right-0 text-text-secondary-light dark:text-text-secondary-dark flex items-center justify-center pr-[15px]">
<span class="material-symbols-outlined">location_on</span>
</div>
</div>
</label>
</div>
<!-- Distance Slider -->
<div class="@container px-4 py-2">
<div class="relative flex w-full flex-col items-start justify-between gap-3 @[480px]:flex-row">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal w-full shrink-[3]">Distance</p>
<div class="flex h-[38px] w-full items-center pt-1.5">
<div class="flex h-1 w-full rounded-full bg-border-light dark:bg-border-dark">
<div class="relative w-[35%]">
<div class="h-1 rounded-full bg-primary"></div>
<div class="absolute -right-3 -top-1.5 flex flex-col items-center gap-2">
<div class="size-4 rounded-full bg-primary ring-4 ring-primary/20"></div>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal">50 km</p>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Section 2: Recherche de relation -->
<h3 class="text-text-primary-light dark:text-text-primary-dark text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-8">Recherche de relation</h3>
<!-- Dropdown / Select -->
<div class="px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal pb-2">Type de relation</p>
<div class="relative w-full">
<select class="form-select appearance-none w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl bg-surface-light dark:bg-surface-dark text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark focus:border-primary h-14 p-[15px] pr-12 text-base font-normal leading-normal">
<option>Relation sérieuse</option>
<option>Rien de sérieux</option>
<option>Amical</option>
<option>Je ne sais pas encore</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-text-secondary-light dark:text-text-secondary-dark">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label>
</div>
<!-- Section 3: Style de vie -->
<h3 class="text-text-primary-light dark:text-text-primary-dark text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-8">Style de vie</h3>
<div class="px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal pb-2">Enfants</p>
<div class="relative w-full">
<select class="form-select appearance-none w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl bg-surface-light dark:bg-surface-dark text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark focus:border-primary h-14 p-[15px] pr-12 text-base font-normal leading-normal">
<option>N'a pas d'enfants</option>
<option>A des enfants</option>
<option>En veut un jour</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-text-secondary-light dark:text-text-secondary-dark">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label>
</div>
<!-- Section 4: Centres d'intérêt -->
<h3 class="text-text-primary-light dark:text-text-primary-dark text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-8">Centres d'intérêt</h3>
<!-- Chip Group -->
<div class="flex flex-wrap gap-3 px-4 py-3">
<button class="rounded-full border border-primary bg-primary/20 px-4 py-2 text-sm font-medium text-primary">Sport</button>
<button class="rounded-full border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark px-4 py-2 text-sm font-medium text-text-primary-light dark:text-text-primary-dark">Cinéma</button>
<button class="rounded-full border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark px-4 py-2 text-sm font-medium text-text-primary-light dark:text-text-primary-dark">Voyages</button>
<button class="rounded-full border border-primary bg-primary/20 px-4 py-2 text-sm font-medium text-primary">Musique</button>
<button class="rounded-full border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark px-4 py-2 text-sm font-medium text-text-primary-light dark:text-text-primary-dark">Art</button>
<button class="rounded-full border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark px-4 py-2 text-sm font-medium text-text-primary-light dark:text-text-primary-dark">Cuisine</button>
<button class="rounded-full border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark px-4 py-2 text-sm font-medium text-text-primary-light dark:text-text-primary-dark">Photographie</button>
</div>
</main>
<!-- Section 5: Actions -->
<div class="fixed bottom-0 left-0 right-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm p-4 border-t border-border-light dark:border-border-dark">
<div class="flex flex-col items-center gap-4">
<p class="text-sm text-text-secondary-light dark:text-text-secondary-dark">1,234 profils correspondent à vos critères</p>
<button class="flex h-14 w-full items-center justify-center rounded-full bg-primary text-white text-base font-bold leading-normal">Voir les résultats</button>
</div>
</div>
</div>
</body></html>
