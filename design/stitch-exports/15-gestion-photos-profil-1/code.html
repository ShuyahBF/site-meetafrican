              "background-light": "#f8f5f6",

            'GRAD' 0,

                        Principale

<div class="relative group bg-cover bg-center flex flex-col rounded-xl justify-end p-4 aspect-square" data-alt="Une femme riant, photo en noir et blanc" style='background-image: linear-gradient(0deg, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0) 60%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuDIUETi2vUUkguFZPNZowNIXc3VJYeownIqxzpgANOD146xrclWTUwGWRWMgXG8roehLyd2VRncXCNnJOvzCnXrwwf2O40Yepiwtdsr6CY6gXp_lvSKleroOHg2NSzGxWec5RM77HuFnn_UWD-XWzy02F8smL6Q2Orn0r76YduZE_Qwy67VUO2X5BWNCtiXEaz8aMdT1rpE0uO3VaDy8c9ouJ3UNgKSw2ncmD9jqDsI5COr5E4z2C3puN2J5b7Sq5Zx8trmMLt7T_Y");'>

<span class="material-symbols-outlined">add_photo_alternate</span>
</div>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium">Ajouter photo</p>

<span class="material-symbols-outlined">add_photo_alternate</span>
</div>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium">Ajouter photo</p>
</div>
</div>

<div class="fixed bottom-24 right-4 z-20">
<button class="flex cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 shadow-lg bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] gap-3 pl-5 pr-6 hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined">add_a_photo</span>
<span class="truncate">Ajouter</span>

<a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary py-2" href="#">

</a>
</nav>
