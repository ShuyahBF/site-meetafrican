# Déploiement Render — backend FastAPI + frontend statique (Vite/React).
#
# Deux services distincts, connectés à ce dépôt GitHub : chaque push sur la
# branche configurée redéploie automatiquement les deux.
#
# Variables marquées "sync: false" ne sont PAS stockées ici (donc pas dans
# git) : Render les demande une fois via son dashboard au premier déploiement,
# puis les garde chiffrées côté plateforme.

services:
  - type: web
    name: meetafrican-backend
    runtime: python
    plan: starter
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # API publique : https://api.beauthentik.net/api (CNAME "api" chez
    # Cloudflare vers ce service Render).
    domains:
      - api.beauthentik.net
    envVars:
      # Render utilise Python 3.14 par défaut, trop récent pour avoir des
      # wheels précompilées de pydantic-core==2.18.2 (dépendance de
      # fastapi==0.110.1) — pip tente alors de compiler depuis les sources et
      # échoue (environnement de build en lecture seule pour le cache Cargo).
      # On fige donc une version de Python pour laquelle des wheels existent,
      # plutôt que de toucher aux versions de dépendances déjà calées entre
      # elles (une pydantic trop récente casse fastapi==0.110.1 autrement).
      - key: PYTHON_VERSION
        value: 3.11.10

      # --- MongoDB Atlas ---
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: site_meetafrican
      - key: MONGO_COLLECTION_PREFIX
        value: maf_

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "10080"

      # --- CORS : URL(s) du site, séparées par une virgule. La PREMIÈRE sert
      # aussi d'URL publique (liens de parrainage, retour des paiements).
      - key: FRONTEND_ORIGIN
        value: https://beauthentik.net,https://www.beauthentik.net

      # --- PawaPay (Mobile Money) ---
      # "sync: false" : valeur saisie dans le tableau de bord Render (production),
      # jamais écrasée par une resynchronisation du Blueprint.
      # --- TikTok Login Kit (« Continuer avec TikTok ») : app créée sur developers.tiktok.com ---
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      # Adresse de retour déclarée dans le portail TikTok
      - key: TIKTOK_REDIRECT_URI
        value: https://api.beauthentik.net/api/auth/tiktok/callback
      - key: PAWAPAY_ENVIRONMENT
        sync: false
      - key: PAWAPAY_API_TOKEN_SANDBOX
        sync: false
      - key: PAWAPAY_API_TOKEN_PRODUCTION
        sync: false
      - key: PAWAPAY_CALLBACK_SECRET
        generateValue: true
      - key: PAWAPAY_DEFAULT_COUNTRY
        value: BFA

      # --- Vérification des numéros par code OTP (voir otp_senders.py) ---
      # WhatsApp Cloud API (Meta) : mêmes valeurs que sawalismartsystems.com
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE_LANG
        value: fr
      # Transmission WA Universelle Liluvine (SAWALI) : utilisée pour les
      # WhatsApp UNIQUEMENT si les paramètres WABA ci-dessus ne sont pas saisis.
      # Adresse du service SAWALI : https://<domaine SAWALI>/api/webhook/liluvine-send
      - key: LILUVINE_WA_URL
        sync: false
      # Clé secrète propre à beAuthentik, générée dans SAWALI (saisie par le propriétaire)
      - key: LILUVINE_WA_HMAC
        sync: false
      # Code émetteur de beAuthentik côté SAWALI (pas secret)
      - key: LILUVINE_WA_EMETTEUR
        value: "beauthentik"
      # Orange SMS API (developer.orange.com)
      - key: ORANGE_SMS_CLIENT_ID
        sync: false
      - key: ORANGE_SMS_CLIENT_SECRET
        sync: false
      - key: ORANGE_SMS_SENDER_MSISDN
        sync: false
      - key: ORANGE_SMS_SENDER_NAME
        sync: false
      # OVH SMS (secours d'Orange, et numéros hors Burkina Faso)
      - key: OVH_SMS_ENDPOINT
        value: ovh-eu
      - key: OVH_SMS_APPLICATION_KEY
        sync: false
      - key: OVH_SMS_APPLICATION_SECRET
        sync: false
      - key: OVH_SMS_CONSUMER_KEY
        sync: false
      - key: OVH_SMS_SERVICE_NAME
        sync: false
      - key: OVH_SMS_SENDER
        sync: false
      - key: DEFAULT_PHONE_COUNTRY_CODE
        value: "226"

      # --- Stockage Cloudflare R2 (obligatoire en production : le mode
      # "local" perd les fichiers à chaque redéploiement sur Render) ---
      - key: STORAGE_BACKEND
        value: r2
      - key: MAX_UPLOAD_BYTES
        value: "8388608"
      - key: MAX_VIDEO_UPLOAD_BYTES
        value: "52428800"
      - key: MAX_VIDEO_DURATION_SECONDS
        value: "60"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_PHOTOS
        value: meetafrican-photos
      - key: R2_BUCKET_DOCUMENTS
        value: meetafrican-documents
      - key: R2_PUBLIC_PHOTOS_BASE_URL
        sync: false
      - key: R2_PRESIGNED_URL_TTL_SECONDS
        value: "600"

      # --- IA de modération (API Anthropic) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODERATION_MODEL
        value: claude-sonnet-5

      # --- Bootstrap du premier compte admin ---
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # "true" le temps d'un redéploiement pour réinitialiser le mot de
      # passe admin oublié (le compte reprend ADMIN_BOOTSTRAP_PASSWORD).
      - key: ADMIN_BOOTSTRAP_RESET_PASSWORD
        sync: false

      # --- VIDAL Sécurisation (api.vidal.fr) — un seul couple app_id/app_key
      # réel, toujours en production (pas de sandbox distincte pour ce
      # compte : décision utilisateur, pour être sûr des retours à jour).
      - key: VIDAL_BASE_URL
        value: https://api.vidal.fr/rest/api
      - key: VIDAL_APP_ID
        sync: false
      - key: VIDAL_APP_KEY
        sync: false
      - key: VIDAL_TIMEOUT_SECONDS
        value: "12"
      - key: VIDAL_CACHE_TTL_HOURS
        value: "168"
      - key: VIDAL_QUOTA_PER_DAY
        value: "200"
      - key: VIDAL_PROXY_SECRET
        generateValue: true

  - type: web
    name: meetafrican-frontend
    runtime: static
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Site public : https://beauthentik.net (+ www), branchés chez Cloudflare.
    domains:
      - beauthentik.net
      - www.beauthentik.net
    envVars:
      # Adresse de l'API (même valeur que le défaut de production dans
      # src/lib/api.js).
      - key: VITE_API_BASE_URL
        value: https://api.beauthentik.net/api
      # Même valeur que VIDAL_PROXY_SECRET côté backend (voir plus haut) — à
      # saisir manuellement des deux côtés, Render ne partage pas les valeurs
      # "sync: false" entre les deux services.
      - key: VITE_VIDAL_PROXY_SECRET
        sync: false
    routes:
      # SPA React Router : toute route inconnue retombe sur index.html,
      # sinon un rechargement sur /connexion (ou toute route non racine) 404.
      - type: rewrite
        source: /*
        destination: /index.html
      # ... autres configurations ...
